# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
#
# No `azure.ai.agent` service block for `it-helpdesk-kb-assistant` here: that
# host type is for `kind: hosted` agents, which need a deployed container
# (see the removed `codeConfiguration`/`container` block this control used
# before 2026-09-24). This control's agent is `kind: prompt` -- a pure
# declarative registration with no code to build or host -- created directly
# via `agent.register_agent()` (see demo.py's setup step), not through azd's
# service deployment flow. See docs/IMPLEMENTATION.md.

name: qlt-001-hallucination-rate-high
services:
    ai-project:
        host: azure.ai.project
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
infra:
    provider: microsoft.foundry

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-dev.txt
            controls/privacy/*/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run all repository and control tests
        run: python -m pytest -q

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile shared and control infrastructure
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          while IFS= read -r template; do
            echo "Compiling ${template}"
            az bicep build --file "${template}" --stdout > /dev/null
          done < <(find infra controls -path '*/infra/*.bicep' -type f | sort)

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --exclude 'https://www.linkedin.com/.*'
            --exclude '^https://github.com/doruit/forged-with-foundry/(?:issues/new|security/advisories/new|actions/workflows/tests.yml/badge.svg)$'
            './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            constraints.txt
            requirements-dev.txt
            schemas/governance-contract/requirements.txt
            controls/privacy/*/requirements.txt
            controls/privacy/*/community/*/requirements.txt
            controls/grounding_and_quality/*/requirements.txt
            controls/value_adoption_and_finops/VAL-001_kpi_underperformance/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installed dependencies
        run: python -m pip check
      - name: Install conftest (pinned + checksum-verified; see policy/governance-contract/README.md)
        env:
          CONFTEST_VERSION: "0.70.0"
          CONFTEST_SHA256: "e738506fd808f7dc9794ce8e325f89b14932891a4841fe45f1f24c4a9bb3ed96"
        run: |
          set -euo pipefail
          curl -sSL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tar.gz" | sha256sum -c -
          tar xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/
          rm conftest.tar.gz
          conftest --version
      - name: Verify the Conftest/Rego policy layer
        run: conftest verify --policy policy/governance-contract
      - name: Install az bicep (for the Azure Policy coexistence regression check)
        run: az bicep install
      - name: Run all repository and control tests
        run: python -m pytest -q

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile shared and control infrastructure
        shell: bash
        run: |
          set -euo pipefail
          az bicep install
          while IFS= read -r template; do
            echo "Compiling ${template}"
            az bicep build --file "${template}" --stdout > /dev/null
          done < <(find infra controls -path '*/infra/*.bicep' -type f | sort)

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --exclude 'https://www.linkedin.com/.*'
            --exclude '^https://github.com/doruit/forged-with-foundry/(?:issues/new|security/advisories/new|actions/workflows/tests.yml/badge.svg)$'
            './**/*.md'
          fail: true
          token: ${{ secrets.GITHUB_TOKEN }}

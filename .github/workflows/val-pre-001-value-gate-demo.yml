name: "VAL-PRE-001: CI check + CD deployment gate demo"

# Optional extension to controls/value_adoption_and_finops/VAL-PRE-001_value_hypothesis_missing.
# Not part of the control's core, always-required demo (demo.sh / infra/deploy.sh), which stays
# zero-cost and validate-only.
#
# Uses correct CI/CD terminology, matching the control's README:
#   - CI check (job `ci-check`): a continuous-integration check. It validates/tests the
#     .fwf/agents/helpdesk-tier1-triage/governance.yaml contract structurally with no Azure
#     credentials at all, so it is safe to run automatically on every pull request that touches
#     a fixture or the shared validator, the same way a unit-test job would validate any other
#     input file. This is the "content-aware gate" from the README.
#   - Policy gate (Conftest, inside job `cd-deploy-gate-2-allowed`): the same commit's workload
#     is evaluated against the protected, checked-in manifest/profile
#     (examples/deployment-manifests/val-pre-001-only.yaml, profile `val-pre-001-only`) via
#     scripts/deployment_gate.sh before the real Azure deployment step runs. Its evidence artifact
#     is uploaded so a reviewer can inspect exactly what was checked and decided. This is the
#     **policy-pass** call site from docs/governance-contract.md#where-enforcement-happens; it is
#     new and distinct from the CI check above (which only proves schema-valid) and from Azure
#     Policy below (which only proves deployment-allowed).
#   - CD deployment (jobs `cd-*`): the continuous-deployment stage. These jobs authenticate to
#     Azure via OIDC through the `production` GitHub Environment and actually call
#     `az deployment group create`. They stay `workflow_dispatch`-only (never triggered by a pull
#     request, including from forks) because they hold real deployment credentials.
#   - Azure Policy (deployed by infra/deploy.sh) is the platform admission control evaluated by
#     Azure Resource Manager itself at CD deployment time, independent of GitHub entirely. It is
#     the "presence-only platform gate" from the README: it re-checks the two reduced tags, never
#     the governance contract itself, and cannot distinguish genuine tags from forged ones.
#     `cd-deploy-gate-2-backstop` deliberately skips both the CI check AND the new policy gate to
#     prove this platform gate enforces on its own -- keep that job's deliberate-bypass intent
#     separate from the normal, gated path in `cd-deploy-gate-2-allowed`.
#
# Prerequisites (see the control's README "Optional: run the real CI check + CD deployment demo"):
#   1. infra/deploy.sh has deployed the VAL-PRE-001 Azure Policy gate.
#   2. infra/deploy-oidc.sh has provisioned the GitHub OIDC identity.
#   3. The repository's "production" GitHub Environment has these variables set:
#      AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP.

"on":
  workflow_dispatch: {}
  pull_request:
    paths:
      - "controls/value_adoption_and_finops/VAL-PRE-001_value_hypothesis_missing/fixtures/**"
      - "schemas/governance-contract/**"
      - "scripts/validate_governance_contract.py"

permissions:
  contents: read

defaults:
  run:
    working-directory: controls/value_adoption_and_finops/VAL-PRE-001_value_hypothesis_missing

jobs:
  ci-check:
    name: "CI check (Gate 1): governance.yaml must be structurally complete"
    runs-on: ubuntu-latest
    outputs:
      value_hypothesis_status: ${{ steps.assess.outputs.value_hypothesis_status }}
      business_case_id: ${{ steps.assess.outputs.business_case_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Assess the complete-workload contract and publish its authoritative deployment tags
        id: assess
        run: |
          json="$(python ../../../scripts/validate_governance_contract.py \
            --contract fixtures/complete-workload/.fwf/agents/helpdesk-tier1-triage/governance.yaml \
            --control VAL-PRE-001)"
          echo "${json}"
          status="$(printf '%s' "${json}" | python -c 'import json, sys; print(json.load(sys.stdin)["control"]["status"])')"
          business_case_id="$(printf '%s' "${json}" | python -c 'import json, sys; print(json.load(sys.stdin)["control"]["entry"]["evidence"].get("businessCaseId", ""))')"
          echo "value_hypothesis_status=${status}" >> "${GITHUB_OUTPUT}"
          echo "business_case_id=${business_case_id}" >> "${GITHUB_OUTPUT}"
      - name: Validator must pass on the complete-workload contract
        run: |
          python ../../../scripts/validate_governance_contract.py \
            --contract fixtures/complete-workload/.fwf/agents/helpdesk-tier1-triage/governance.yaml \
            --control VAL-PRE-001 --enforce
      - name: Validator must fail on the incomplete-workload contract
        run: |
          set +e
          python ../../../scripts/validate_governance_contract.py \
            --contract fixtures/incomplete-workload/.fwf/agents/helpdesk-tier1-triage/governance.yaml \
            --control VAL-PRE-001 --enforce
          exit_code=$?
          set -e
          echo "Validator exit code: ${exit_code}"
          if [ "${exit_code}" -eq 0 ]; then
            echo "::error::Expected --enforce to fail on an incomplete hypothesis, but it passed."
            exit 1
          fi
          if [ "${exit_code}" -ne 1 ]; then
            echo "::error::Validator crashed (exit ${exit_code}) instead of denying the request (expected exit 1). A crashed validator is not a passing negative test."
            exit 1
          fi
          echo "BLOCKED as expected (exit 1: denied, not crashed). This is a CI check: no Azure credentials were used, no Azure call was made."

  cd-deploy-gate-2-allowed:
    name: "CD deployment (Gate 2 allows): CI check + policy gate passed, Azure Policy allows the real deployment"
    needs: ci-check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Install conftest (pinned; see policy/governance-contract/README.md)
        env:
          CONFTEST_VERSION: "0.70.0"
        run: |
          set -euo pipefail
          curl -sSL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/
          rm conftest.tar.gz
      - name: "Policy gate (Conftest): must pass before any Azure deployment step runs"
        run: |
          ../../../scripts/deployment_gate.sh \
            --manifest ../../../examples/deployment-manifests/val-pre-001-only.yaml \
            --profile val-pre-001-only \
            --root fixtures/complete-workload \
            --evidence-out val-pre-001-gate-evidence.json
      - name: Upload policy gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: val-pre-001-gate-evidence
          path: controls/value_adoption_and_finops/VAL-PRE-001_value_hypothesis_missing/val-pre-001-gate-evidence.json
          if-no-files-found: warn
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the demo target using Gate 1's own outputs (Azure Policy evaluates the real request)
        env:
          VALUE_HYPOTHESIS_STATUS: ${{ needs.ci-check.outputs.value_hypothesis_status }}
          BUSINESS_CASE_ID: ${{ needs.ci-check.outputs.business_case_id }}
        run: |
          az deployment group create \
            --name "val-pre-001-gha-complete-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/demo-target.bicep \
            --parameters demoResourceName=valpre001-gha-demo \
                         valueHypothesisStatus="${VALUE_HYPOTHESIS_STATUS}" \
                         businessCaseId="${BUSINESS_CASE_ID}"
          echo "VALIDATED and deployed as expected by Azure Policy."
      - name: Clean up the demo resource this run created
        if: always()
        run: |
          az resource delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name valpre001-gha-demo \
            --resource-type Microsoft.Insights/actionGroups 2>/dev/null || true

  cd-deploy-gate-2-backstop:
    name: "CD deployment (Gate 2 backstop): Azure Policy still blocks a request that skipped the CI check"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Attempt a deployment that never ran the CI check
        run: |
          set +e
          az deployment group create \
            --name "val-pre-001-gha-bypass-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/demo-target.bicep \
            --parameters demoResourceName=valpre001-gha-bypass-demo \
                         valueHypothesisStatus=incomplete \
                         businessCaseId="" \
            --output none 2> az-error.log
          exit_code=$?
          set -e
          if [ "${exit_code}" -eq 0 ]; then
            echo "::error::Azure allowed a request the CI check never reviewed. Azure Policy should have denied it."
            exit 1
          fi
          if ! grep -q "RequestDisallowedByPolicy" az-error.log; then
            cat az-error.log
            echo "::error::The deployment failed, but not because Azure Policy denied it."
            exit 1
          fi
          echo "BLOCKED by Azure Policy as expected, even though the CI check was skipped. This proves"
          echo "Azure Policy still enforces its metadata rule; it does NOT prove the CI check ran, and it"
          echo "cannot distinguish these forged tags from tags a real CI check would have produced."

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Bundled because agent-framework-foundry pins a specific azure-ai-projects
      # range; bumping them separately can produce mutually unresolvable PRs.
      agent-framework-and-azure-ai:
        patterns:
          - "agent-framework-*"
          - "azure-ai-*"
      azure-sdk:
        patterns:
          - "azure-*"
        exclude-patterns:
          - "azure-ai-*"
    ignore:
      # agent-framework-foundry 1.12.0 still pins azure-ai-projects<2.4.0, so
      # Dependabot cannot resolve a bump past 2.3.x today. Remove this once a
      # future agent-framework-foundry release widens that range.
      - dependency-name: "azure-ai-projects"
        versions: [">=2.4.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
